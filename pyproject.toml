[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemma-studio"
version = "0.1.0"
description = "Local-first Gemma desktop AI workspace"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<0.116",
  "starlette>=0.40,<0.42",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "sqlmodel>=0.0.22,<1",
  "transformers>=4.46,<5",
  "torch>=2.3,<3",
  "accelerate>=1.0,<2",
  "huggingface-hub>=0.26,<1",
  "langchain-core>=0.3,<1",
  "langgraph>=0.2,<1",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "ddgs>=9,<10",
  "arize-phoenix-otel>=0.7,<1",
  "arize-phoenix>=12,<13",
  "arize-phoenix-evals>=2.13,<3",
  "openinference-instrumentation-langchain>=0.1.29,<1",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
  "opentelemetry-instrumentation-httpx>=0.50b0,<1",
]

[project.optional-dependencies]
gpu = ["bitsandbytes>=0.44,<1"]
image = ["diffusers>=0.31,<1", "safetensors>=0.4,<1", "Pillow>=10,<12"]
voice = ["faster-whisper>=1.1,<2", "pyttsx3>=2.98,<3"]
visual = ["manim>=0.19,<0.20"]
talk = ["faster-whisper>=1.1,<2", "pyttsx3>=2.98,<3", "manim>=0.19,<0.20"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.7,<1", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
